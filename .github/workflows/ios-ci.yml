name: iOS CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
        run: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Pick iPhone simulator
        id: sim
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          d=json.load(sys.stdin)["devices"]
          c=[(rt,x) for rt,l in d.items() if "iOS" in rt for x in l if x["name"].startswith("iPhone")]
          c.sort(key=lambda t:[int(p) for p in t[0].rsplit("iOS-",1)[-1].split("-")])
          print(c[-1][1]["udid"] if c else "")')
          test -n "$UDID" || { echo "No iPhone simulator"; xcrun simctl list devices; exit 1; }
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices | grep "$UDID"

      - name: Test (Debug)
        run: |
          set -o pipefail
          xcodebuild test -project ClipDock.xcodeproj -scheme ClipDock -configuration Debug \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath TestResults.xcresult CODE_SIGNING_ALLOWED=NO

      - name: Release build (simulator, unsigned)
        run: |
          set -o pipefail
          xcodebuild build -project ClipDock.xcodeproj -scheme ClipDock -configuration Release \
            -sdk iphonesimulator -destination "generic/platform=iOS Simulator" CODE_SIGNING_ALLOWED=NO

      - name: Upload xcresult
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults-${{ github.run_id }}
          path: TestResults.xcresult
          if-no-files-found: warn
